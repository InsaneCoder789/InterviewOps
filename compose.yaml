# Local development only: debug mode, a throwaway database password, and mail
# printed to the worker's log. Never use this file to host anything.
#   docker compose up --build
#   docker compose exec api python manage.py seed_demo
x-app: &app
  build: .
  environment:
    DJANGO_DEBUG: "1"
    DATABASE_URL: postgresql://interviewops:local-only@db:5432/interviewops
    CORS_ALLOWED_ORIGINS: http://localhost:5173
    APP_BASE_URL: http://localhost:5173
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: interviewops
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: interviewops
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "interviewops"]
      interval: 3s
      retries: 20

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 3s
      retries: 20

  worker:
    <<: *app
    command: python manage.py send_notifications
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
