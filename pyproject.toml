[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["web", "website", "*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "DJ", "PERF",
    "RUF", "N", "DTZ", "LOG", "G", "S", "T20",
]
# Django and DRF declare configuration as mutable class attributes by design.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests use made-up passwords and seeded randomness, and their lambdas run before
# the loop moves on.
"tests/*" = ["S105", "S106", "S311", "S603", "B023"]

[tool.coverage.run]
branch = true
source = ["accounts", "config", "feedback", "notifications", "scheduling"]
omit = ["*/migrations/*", "config/wsgi.py"]
concurrency = ["thread"]
# Measure the worker and settings processes the tests start.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
