<svg xmlns="http://www.w3.org/2000/svg" class="io-still" viewBox="0 0 720 604" width="720" height="604" role="img" aria-labelledby="ch2-4-two-bookings-w-t ch2-4-two-bookings-w-d">
<title id="ch2-4-two-bookings-w-t">Hypothetical: two bookings for one slot</title>
<desc id="ch2-4-two-bookings-w-d">Sequence from top to bottom: A reads free, B reads free, A inserts, B inserts. Both gaps are bracketed. Two overlapping bookings, marked as conflicts, sit on one slot.</desc>
