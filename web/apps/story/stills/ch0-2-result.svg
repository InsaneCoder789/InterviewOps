<svg xmlns="http://www.w3.org/2000/svg" class="io-still" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="ch0-2-result-w-t ch0-2-result-w-d">
<title id="ch0-2-result-w-t">One booking, one clear refusal</title>
<desc id="ch0-2-result-w-d">Request A holds the slot with 201 booked. Request B is refused with 409, This slot is already booked.</desc>
<style>.io-still{--io-ground:var(--ground,#E6E8EC);--io-surface:var(--surface,#FFFFFF);--io-ink:var(--ink,#121826);--io-muted:var(--muted,#4C5568);--io-edge:var(--edge,#6B7489);--io-line:var(--line,#C2C7D1);--io-primary:var(--primary,#3447D4);--io-booked:var(--booked,#0B6B52);--io-conflict:var(--conflict,#A63C26);--io-waiting:var(--waiting,#7D5200);--io-on-fill:var(--on-fill,#FFFFFF);}@media (prefers-color-scheme:dark){.io-still{--io-ground:var(--ground,#0D111A);--io-surface:var(--surface,#151B28);--io-ink:var(--ink,#E8ECF4);--io-muted:var(--muted,#A3AEC3);--io-edge:var(--edge,#7C89A5);--io-line:var(--line,#2C364B);--io-primary:var(--primary,#8C9BFF);--io-booked:var(--booked,#4FD1A5);--io-conflict:var(--conflict,#FF8A70);--io-waiting:var(--waiting,#F0BC55);--io-on-fill:var(--on-fill,#0D111A);}}.io-still text{font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;font-variant-numeric:tabular-nums}.io-still .mono{font-family:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace}.io-still .b{font-weight:600}.io-still .f-ground{fill:var(--io-ground)}.io-still .s-ground{stroke:var(--io-ground);fill:none}.io-still .f-surface{fill:var(--io-surface)}.io-still .s-surface{stroke:var(--io-surface);fill:none}.io-still .f-ink{fill:var(--io-ink)}.io-still .s-ink{stroke:var(--io-ink);fill:none}.io-still .f-muted{fill:var(--io-muted)}.io-still .s-muted{stroke:var(--io-muted);fill:none}.io-still .f-edge{fill:var(--io-edge)}.io-still .s-edge{stroke:var(--io-edge);fill:none}.io-still .f-line{fill:var(--io-line)}.io-still .s-line{stroke:var(--io-line);fill:none}.io-still .f-primary{fill:var(--io-primary)}.io-still .s-primary{stroke:var(--io-primary);fill:none}.io-still .f-booked{fill:var(--io-booked)}.io-still .s-booked{stroke:var(--io-booked);fill:none}.io-still .f-conflict{fill:var(--io-conflict)}.io-still .s-conflict{stroke:var(--io-conflict);fill:none}.io-still .f-waiting{fill:var(--io-waiting)}.io-still .s-waiting{stroke:var(--io-waiting);fill:none}.io-still .f-on-fill{fill:var(--io-on-fill)}.io-still .s-on-fill{stroke:var(--io-on-fill);fill:none}</style>
<defs><pattern id="ch0-2-result-w-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="8" class="f-ink"/></pattern></defs>
<rect width="720" height="470" class="f-ground"/>
<text x="16" y="28" font-size="16" text-anchor="start" class="f-muted">Order of events, downward</text>
<path d="M16 40L704 40" class="s-edge" stroke-width="1" />
<text x="170" y="70" font-size="16" text-anchor="middle" class="f-ink b">request A</text>
<text x="550" y="70" font-size="16" text-anchor="middle" class="f-ink b">request B</text>
<path d="M170 82L170 142" class="s-edge" stroke-width="2" stroke-dasharray="4 5"/>
<path d="M550 82L550 142" class="s-edge" stroke-width="2" stroke-dasharray="4 5"/>
<path d="M522 150H578V163L571 170L578 177V190H522Z" class="f-conflict" />
<rect x="518" y="146" width="4" height="48" class="f-ink" />
<text x="550" y="176.3" font-size="18" text-anchor="middle" class="f-on-fill b">B</text>
<rect x="508" y="100" width="67" height="30" class="f-surface" />
<rect x="508" y="100" width="67" height="30" class="s-conflict" stroke-width="2"/>
<path d="M518 108H532V110.8L525.7 115.0L532 119.2V122H518Z" class="f-conflict" />
<text x="539" y="120.25" font-size="15" text-anchor="start" class="f-conflict b">409</text>
<rect x="200" y="218" width="320" height="92" class="f-surface" />
<rect x="200" y="218" width="320" height="92" class="s-edge" stroke-width="2"/>
<text x="214" y="242" font-size="16" text-anchor="start" class="f-ink b">slot 1: one hour</text>
<rect x="222" y="256" width="276" height="40" class="f-booked" />
<rect x="218" y="252" width="4" height="48" class="f-ink" />
<text x="360" y="281.6" font-size="16" text-anchor="middle" class="f-on-fill b">A  201 booked</text>
<text x="360" y="346" font-size="16" text-anchor="middle" class="f-ink b">One request gets the hour.</text>
<text x="360" y="382" font-size="16" text-anchor="middle" class="f-booked b">A: 201, booked.</text>
<text x="360" y="408" font-size="16" text-anchor="middle" class="f-conflict b">B: 409, “This slot is already booked.”</text>
<text x="360" y="444" font-size="16" text-anchor="middle" class="f-muted">Either request can win. Here A is drawn winning.</text>
