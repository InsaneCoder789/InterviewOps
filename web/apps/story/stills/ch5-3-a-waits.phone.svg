<svg xmlns="http://www.w3.org/2000/svg" class="io-still" viewBox="0 0 328 585" width="328" height="585" role="img" aria-labelledby="ch5-3-a-waits-p-t ch5-3-a-waits-p-d">
<title id="ch5-3-a-waits-p-t">Lock removed: A waits for B</title>
