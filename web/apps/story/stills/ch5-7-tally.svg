<svg xmlns="http://www.w3.org/2000/svg" class="io-still" viewBox="0 0 720 476" width="720" height="476" role="img" aria-labelledby="ch5-7-tally-w-t ch5-7-tally-w-d">
<title id="ch5-7-tally-w-t">Recorded outcomes with the lock removed</title>
<desc id="ch5-7-tally-w-d">Sixty request outcomes from 30 rounds of two requests: 30 bookings created, 27 clean conflicts and 3 deadlocks. A local test with the lock removed on purpose; counts vary between runs.</desc>
