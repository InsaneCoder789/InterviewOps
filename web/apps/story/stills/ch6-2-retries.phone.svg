<text x="16" y="461" font-size="14" text-anchor="start" class="f-ink">failure 9</text>
<rect x="96" y="445" width="166" height="22" class="f-surface" />
<rect x="92" y="441" width="4" height="30" class="f-ink" />
<rect x="96" y="445" width="166" height="22" class="f-waiting" />
<text x="270" y="461" font-size="14" text-anchor="start" class="f-ink b mono">60 min</text>
