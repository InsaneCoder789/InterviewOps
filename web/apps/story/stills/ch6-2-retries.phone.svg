<rect x="92" y="251" width="4" height="30" class="f-ink" />
<rect x="96" y="255" width="22.1333" height="22" class="f-waiting" />
<text x="126.133" y="271" font-size="14" text-anchor="start" class="f-ink b mono">8 min</text>
<text x="16" y="309" font-size="14" text-anchor="start" class="f-ink">failure 5</text>
<rect x="96" y="293" width="44.2667" height="22" class="f-surface" />
<rect x="92" y="289" width="4" height="30" class="f-ink" />
<rect x="96" y="293" width="44.2667" height="22" class="f-waiting" />
<text x="148.267" y="309" font-size="14" text-anchor="start" class="f-ink b mono">16 min</text>
<text x="16" y="347" font-size="14" text-anchor="start" class="f-ink">failure 6</text>
