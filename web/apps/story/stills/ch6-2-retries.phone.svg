<path d="M96 487H308V492.333L297.333 503L308 513.667V519H96Z" class="f-conflict" />
<rect x="92" y="483" width="4" height="40" class="f-ink" />
<text x="202" y="507.9" font-size="14" text-anchor="middle" class="f-on-fill b">failed</text>
<text x="16" y="555" font-size="14" text-anchor="start" class="f-ink b">Ten attempts, about four hours. No</text>
<text x="16" y="574" font-size="14" text-anchor="start" class="f-ink b">further tries.</text>
</svg>
